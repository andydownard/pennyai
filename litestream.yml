# Litestream config — replicates the Groflo SQLite db to S3/R2 continuously.
# The db file and replica path retain the historical "thriftly" name to avoid
# breaking the existing backup chain. Renaming would orphan all prior snapshots.
dbs:
  - path: ${DB_PATH:-thriftly.db}
    replicas:
      - type: s3
        bucket: ${LITESTREAM_REPLICA_BUCKET}
        path: thriftly
        endpoint: ${LITESTREAM_REPLICA_ENDPOINT}
        access-key-id: ${LITESTREAM_ACCESS_KEY_ID}
        secret-access-key: ${LITESTREAM_SECRET_ACCESS_KEY}
        retention: 72h
        sync-interval: 10s
