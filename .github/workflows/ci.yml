name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Production runs on PostgreSQL, and so do the tests: PostgreSQL is the only
  # database anywhere. The suite clones a per-test database from a template, so
  # the service user needs CREATE DATABASE (the postgres superuser has it).
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # pipefail matters: without it the grep's exit status replaced the test
      # run's, and a trailing "|| true" meant this step could never fail.
      - name: Run tests
        run: |
          set -o pipefail
          go test -count=1 -race -timeout 20m ./... 2>&1 | tee test-output.txt | grep -E '^(--- FAIL|FAIL|ok|panic)' || {
            status=${PIPESTATUS[0]}
            tail -200 test-output.txt
            exit "${status:-1}"
          }

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Check test-to-code ratio
        run: bash scripts/check-test-ratio.sh --ci

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npx vite build
