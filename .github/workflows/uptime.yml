name: Uptime Monitor

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allow manual trigger

# Needed so the "Create GitHub issue on persistent downtime" step can write
# issues (default GITHUB_TOKEN is read-only → was 403'ing).
permissions:
  issues: write
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check app health
        id: health
        run: |
          HTTP_CODE=$(curl -s -o /tmp/health_response -w "%{http_code}" --max-time 10 https://groflo.rallytasks.com/health || echo "000")
          echo "http_code=$HTTP_CODE" >> $GITHUB_OUTPUT
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ App is healthy (HTTP $HTTP_CODE)"
            cat /tmp/health_response
          else
            echo "❌ App is DOWN (HTTP $HTTP_CODE)"
            cat /tmp/health_response 2>/dev/null || true
          fi

      - name: Retry health check (if first failed)
        id: retry
        if: steps.health.outputs.http_code != '200'
        run: |
          echo "Waiting 30s before retry..."
          sleep 30
          HTTP_CODE=$(curl -s -o /tmp/health_retry -w "%{http_code}" --max-time 10 https://groflo.rallytasks.com/health || echo "000")
          echo "http_code=$HTTP_CODE" >> $GITHUB_OUTPUT
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ App recovered on retry (HTTP $HTTP_CODE)"
          else
            echo "❌ App still DOWN after retry (HTTP $HTTP_CODE)"
          fi

      - name: Trigger Railway redeploy
        if: steps.health.outputs.http_code != '200' && steps.retry.outputs.http_code != '200'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "⚠️ RAILWAY_TOKEN not set — cannot auto-redeploy"
            exit 1
          fi
          echo "🔄 Triggering Railway redeploy..."
          # Use Railway GraphQL API to trigger a redeploy
          curl -s -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "query": "mutation { serviceInstanceRedeploy(serviceId: \"'"${{ secrets.RAILWAY_SERVICE_ID }}"'\", environmentId: \"'"${{ secrets.RAILWAY_ENV_ID }}"'\") }"
            }' | tee /tmp/redeploy_response
          echo ""
          echo "Redeploy triggered. Waiting 90s for it to come up..."
          sleep 90
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://groflo.rallytasks.com/health || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ App recovered after redeploy"
          else
            echo "❌ App still down after redeploy (HTTP $HTTP_CODE) — manual intervention needed"
          fi

      - name: Create GitHub issue on persistent downtime
        if: steps.health.outputs.http_code != '200' && steps.retry.outputs.http_code != '200'
        uses: actions/github-script@v7
        with:
          script: |
            // Check if there's already an open downtime issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'downtime'
            });
            if (issues.data.length > 0) {
              // Add a comment to existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: `⏰ Still down at ${new Date().toISOString()}. Auto-redeploy was attempted.`
              });
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🚨 App down — ${new Date().toISOString()}`,
                body: `The uptime monitor detected that https://groflo.rallytasks.com/health is not returning 200.\n\nAn automatic redeploy was attempted.\n\nPlease investigate Railway logs.`,
                labels: ['downtime']
              });
            }
